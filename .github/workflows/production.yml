name: Build & Push Docker Image

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            app/node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: cd app && yarn install --frozen-lockfile

  lint:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            app/node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Lint
        run: cd app && yarn lint

  test:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            app/node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Test
        run: cd app && yarn test

  # Builds and pushes; it does not deploy. ArgoCD Image Updater watches GHCR and
  # commits the new tag into hongjs/gitops itself, which replaces the previous
  # workflow_dispatch into horpak-nextjs-manifest that sed'd the tag and
  # force-pushed to main.
  docker-build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag name
        id: extract_tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Extracted tag: ${TAG}"

          # Validate semantic version format (v#.#.#)
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag ${TAG} does not match semantic versioning pattern v*.*.*"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU: the runner is already amd64 and that is the only target, so
      # emulation was pure build time.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          platforms: linux/amd64
          tags: ghcr.io/hongjs/horpakjs:${{ steps.extract_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
